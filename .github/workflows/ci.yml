name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    - cron: '0 12 * * 1'   # weekly, Mondays 12:00 UTC (upstream health check)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint installers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax check (every .sh and .command)
        run: git ls-files '*.sh' '*.command' | while read -r f; do bash -n "$f" || exit 1; done
      - name: Manual downloads, link checks and guides agree (both installers)
        run: bash .github/scripts/check-consistency.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Manual Q&A retrieval question set
        run: node --test doc-qa/retrieval.test.mjs
      - name: Browser-only additions preserve OsmAnd metadata
        run: bash .github/scripts/check-browser-map-isolation.sh
      - name: OffRoad cross-platform viewer launcher
        run: bash .github/scripts/check-offroad-viewer.sh
      - name: Changelog fragments have valid names and content
        run: bash .github/scripts/compile-changelog.sh > /dev/null
      - name: Changelog compiler regression checks
        run: bash .github/scripts/check-changelog.sh
      - name: Launcher parity (bash vs PowerShell installer)
        run: bash .github/scripts/check-launchers.sh
      - name: Catalog ids and sizes match both installers (#139)
        run: bash .github/scripts/check-catalog.sh
      - name: Component table has a license and source for every download (#67)
        run: bash .github/scripts/check-components.sh
      - name: SOURCES.md is up to date with components.tsv (#67)
        run: bash .github/scripts/build-sources.sh --check
      - name: Region tokens pick the same maps in both installers
        run: bash .github/scripts/check-regions.sh
      - name: Picker catalog.js matches catalog.json (#188)
        run: bash .github/scripts/build-catalog-js.sh --check
      - name: About page is up to date with CONTRIBUTORS (#189)
        run: bash .github/scripts/build-about.sh --check
      - name: Docs site mirror is up to date with docs/*.html (#205)
        run: bash .github/scripts/build-web-docs.sh --check
      - name: doc-qa reader allowlist covers every sources.tsv folder
        run: bash .github/scripts/check-doc-allowlist.sh
      - name: Checksum list parity, full run and --only (#195)
        run: bash .github/scripts/check-checksums.sh
      - name: MedlinePlus page CSP hash (inline script allowed by hash)
        run: bash .github/scripts/check-csp-hash.sh
      - name: PowerShell parse + analyze
        shell: pwsh
        run: |
          $err = $null
          foreach ($f in (git ls-files '*.ps1')) {
            [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD/$f", [ref]$null, [ref]$err)
            if ($err) { $err | ForEach-Object { Write-Error $_.Message }; exit 1 }
            Write-Host "parse OK: $f"
          }
          try {
            Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -ErrorAction Stop
            $issues = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error
            if ($issues) { $issues | Format-Table | Out-String | Write-Error; exit 1 }
            Write-Host "PSScriptAnalyzer: no errors"
          } catch { Write-Host "PSScriptAnalyzer skipped: $($_.Exception.Message)" }

  smoke:
    # Engine picking and portability on each OS (#69): the installer's own engine, launcher and
    # CHECK-DRIVE code, with only this OS's llama.cpp engine downloaded (no models, ZIMs or maps).
    name: Smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Engine, launchers, move, run from the new path
        if: runner.os != 'Windows'
        run: bash .github/scripts/check-smoke.sh
      - name: Engine, launchers, move, run from the new path
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          .\.github\scripts\check-fetch.ps1
          .\.github\scripts\check-smoke.ps1
      - name: Map refresh regression (PowerShell and Git Bash)
        if: runner.os == 'Windows'
        shell: bash
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .github/scripts/check-map-refresh.ps1
      - name: OffRoad Windows launcher, stale junction and relocation
        if: runner.os == 'Windows'
        shell: powershell
        run: .\.github\scripts\check-offroad-viewer.ps1
      - name: Manual Q&A source pairing and relocation (PowerShell and Git Bash)
        if: runner.os == 'Windows'
        shell: powershell
        run: .\.github\scripts\check-doc-qa.ps1
      - name: Catalog ids with Windows PowerShell 5.1 (#139)
        if: runner.os == 'Windows'
        shell: bash
        env:
          OEL_PS: powershell.exe
        run: bash .github/scripts/check-catalog.sh
      - name: Region tokens with Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: bash
        env:
          OEL_PS: powershell.exe
        run: bash .github/scripts/check-regions.sh
      - name: Manual Q&A launcher execution (macOS and Linux)
        if: runner.os != 'Windows'
        run: bash .github/scripts/check-doc-launchers.sh
      - name: Manual Q&A launcher execution (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: .\.github\scripts\check-doc-launchers.ps1

  links:
    name: Upstream source health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check that all download sources still resolve
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/check-links.sh
      - name: Verify manual Q&A source text
        run: bash .github/scripts/check-doc-sources.sh
