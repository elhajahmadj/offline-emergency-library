name: Update SHA256SUMS

# SHA256SUMS.txt is owned by this workflow. PRs must not edit it: every PR that
# changed an installer used to conflict with every other one on that file.
on:
  push:
    branches: [ main ]
    paths-ignore: [ 'SHA256SUMS.txt' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sha256sums
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Regenerate and commit SHA256SUMS.txt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A merge can land between checkout and push; on rejection start over from the
          # new main so the hashes are computed from the files that are actually there.
          for attempt in 1 2 3; do
            bash .github/scripts/update-sha256sums.sh
            if git diff --quiet SHA256SUMS.txt; then echo "SHA256SUMS.txt already current"; exit 0; fi
            git commit -m "Update SHA256SUMS.txt" -m "- Regenerated from the installer scripts on main" SHA256SUMS.txt
            if git push origin HEAD:main; then exit 0; fi
            echo "push rejected (attempt $attempt of 3), retrying from latest main"
            git fetch origin main
            git reset --hard origin/main
          done
          echo "could not push SHA256SUMS.txt after 3 attempts" >&2
          exit 1
