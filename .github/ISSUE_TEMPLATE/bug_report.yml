name: Bug report
description: Something didn't download or work
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for the report! Please include enough detail to reproduce it.
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  - type: dropdown
    id: method
    attributes:
      label: How did you run it?
      options:
        - install.bat (double-click)
        - install.command (double-click, macOS)
        - PowerShell one-liner (irm | iex)
        - macOS/Linux one-liner (curl | bash)
        - Clone and run
        - Claude Code skill
    validations:
      required: true
  - type: input
    id: region
    attributes:
      label: Map region (if relevant)
      placeholder: e.g. US, France, Europe
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect vs. what actually happened?
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Relevant log lines
      description: Paste the relevant lines from `_download.log` in your destination folder.
      render: shell
