name: Feature request / idea
description: Suggest a feature, a region, or an improvement (for new manuals or archives, use "Content suggestion")
title: "[Idea]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
      description: A region, a platform, a feature or a workflow improvement.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why is it useful for offline / emergency use?
